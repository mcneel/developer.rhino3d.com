<!-- AnchorJS https://github.com/bryanbraun/anchorjs -->
<script type="text/javascript" src="{{ (resources.Get "/script/anchor.min.js" | resources.Fingerprint).Permalink }}"></script>
<script>
	// add anchor links that show up when hovering over header
	(function () {
		'use strict';
		anchors.options.placement = 'right';
		// skip headings appengine injects through the skin (.proxy-skin): they get stray ids and hover icons
		anchors.add(':is(h2, h3, h4, h5, h6):not([data-toc="skip"]):not(.proxy-skin *)');
		}
	)();
</script>
